<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>GEOPOLÍTICA — O Jogo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap');

:root {
  --bg:#08090d;
  --bg2:#0d1117;
  --panel:#0f1420;
  --panel2:#131925;
  --border:#1c2a3a;
  --border2:#243040;
  --gold:#c8a84b;
  --gold2:#e8c96a;
  --red:#c0392b;
  --red2:#e74c3c;
  --green:#1a7a4a;
  --green2:#27ae60;
  --blue:#1a4a7a;
  --blue2:#2980b9;
  --purple:#6c3483;
  --purple2:#9b59b6;
  --orange:#d35400;
  --orange2:#e67e22;
  --text:#d4c5a0;
  --text2:#a09070;
  --text3:#6a7080;
  --white:#f0e6cc;
}

*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100vw;height:100vh;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Crimson Pro',serif;}

/* ── SCREEN MANAGER ── */
#screen-select, #screen-game {position:fixed;inset:0;transition:opacity .5s;}
#screen-select{z-index:100;background:var(--bg);}
#screen-game{z-index:50;display:none;}

/* ── SELECT SCREEN ── */
#select-bg {
  position:absolute;inset:0;
  background: radial-gradient(ellipse at 60% 40%, #1a2030 0%, #08090d 70%);
  overflow:hidden;
}
#select-bg::before {
  content:'';position:absolute;inset:0;
  background-image: repeating-linear-gradient(0deg,transparent,transparent 40px,rgba(200,168,75,.03) 40px,rgba(200,168,75,.03) 41px),
    repeating-linear-gradient(90deg,transparent,transparent 40px,rgba(200,168,75,.03) 40px,rgba(200,168,75,.03) 41px);
}

.select-title {
  position:absolute;top:60px;left:0;right:0;text-align:center;
  font-family:'Cinzel',serif;font-size:52px;font-weight:900;
  color:var(--gold2);letter-spacing:6px;
  text-shadow:0 0 40px rgba(200,168,75,.4),0 2px 0 #000;
}
.select-sub {
  position:absolute;top:128px;left:0;right:0;text-align:center;
  font-size:15px;color:var(--text2);letter-spacing:3px;text-transform:uppercase;
}

#country-list {
  position:absolute;top:180px;left:50%;transform:translateX(-50%);
  width:900px;max-height:calc(100vh - 260px);overflow-y:auto;
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
  padding:10px;
}
#country-list::-webkit-scrollbar{width:4px;}
#country-list::-webkit-scrollbar-thumb{background:var(--border2);}

.country-card {
  background:linear-gradient(135deg,#0f1420 0%,#131925 100%);
  border:1px solid var(--border);border-radius:8px;
  padding:14px 16px;cursor:pointer;
  transition:all .2s;position:relative;overflow:hidden;
}
.country-card::before {
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(200,168,75,.05),transparent);
  opacity:0;transition:opacity .2s;
}
.country-card:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.4);}
.country-card:hover::before{opacity:1;}
.cc-flag{font-size:26px;margin-bottom:6px;display:block;}
.cc-name{font-family:'Cinzel',serif;font-size:13px;color:var(--gold2);margin-bottom:8px;}
.cc-stats{display:flex;gap:8px;flex-wrap:wrap;}
.cc-stat{font-size:10px;color:var(--text3);background:rgba(255,255,255,.04);padding:2px 6px;border-radius:3px;}
.cc-stat span{color:var(--text2);}
.cc-difficulty{
  position:absolute;top:10px;right:10px;
  font-size:9px;letter-spacing:1px;padding:2px 6px;border-radius:3px;
}
.diff-easy{background:rgba(26,122,74,.3);color:#6fcf97;border:1px solid rgba(26,122,74,.4);}
.diff-medium{background:rgba(211,84,0,.3);color:#f2994a;border:1px solid rgba(211,84,0,.4);}
.diff-hard{background:rgba(192,57,43,.3);color:#eb5757;border:1px solid rgba(192,57,43,.4);}

/* ── GAME SCREEN ── */
#map-svg{position:absolute;inset:0;width:100%;height:100%;}

/* Top HUD */
#hud-top {
  position:fixed;top:0;left:0;right:0;height:52px;z-index:200;
  background:linear-gradient(180deg,rgba(8,9,13,.98) 0%,rgba(8,9,13,.85) 100%);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 12px;gap:8px;
}
.hud-player {
  display:flex;align-items:center;gap:8px;
  padding:4px 12px;background:rgba(200,168,75,.08);
  border:1px solid rgba(200,168,75,.2);border-radius:6px;
  font-family:'Cinzel',serif;font-size:13px;color:var(--gold2);
  white-space:nowrap;
}
.hud-player .flag{font-size:18px;}

.hud-sep{width:1px;height:32px;background:var(--border);flex-shrink:0;}

.hud-stat {
  display:flex;align-items:center;gap:6px;
  padding:4px 10px;border-radius:5px;
  font-size:13px;cursor:default;white-space:nowrap;
}
.hud-stat .ico{font-size:14px;}
.hud-stat .val{font-weight:600;color:var(--white);}
.hud-stat .lbl{font-size:10px;color:var(--text3);}
.hud-stat.econ{background:rgba(39,174,96,.08);border:1px solid rgba(39,174,96,.15);}
.hud-stat.mil {background:rgba(192,57,43,.08);border:1px solid rgba(192,57,43,.15);}
.hud-stat.pop {background:rgba(41,128,185,.08);border:1px solid rgba(41,128,185,.15);}
.hud-stat.stab{background:rgba(200,168,75,.08);border:1px solid rgba(200,168,75,.15);}
.hud-stat.app {background:rgba(155,89,182,.08);border:1px solid rgba(155,89,182,.15);}

.hud-date {
  margin-left:auto;font-family:'Cinzel',serif;font-size:14px;
  color:var(--gold);letter-spacing:1px;
}

.hud-controls{display:flex;gap:4px;margin-left:8px;}
.ctrl-btn {
  background:rgba(255,255,255,.05);border:1px solid var(--border);
  color:var(--text2);width:30px;height:30px;border-radius:5px;
  cursor:pointer;font-size:14px;transition:all .2s;
  display:flex;align-items:center;justify-content:center;
}
.ctrl-btn:hover{background:rgba(200,168,75,.1);border-color:var(--gold);color:var(--gold);}
.ctrl-btn.active{background:rgba(200,168,75,.15);border-color:var(--gold);color:var(--gold2);}
.speed-indicator{font-size:10px;color:var(--text3);min-width:40px;text-align:center;line-height:1.2;}

/* Bottom nav tabs */
#hud-tabs {
  position:fixed;bottom:0;left:0;right:0;height:44px;z-index:200;
  background:rgba(8,9,13,.95);border-top:1px solid var(--border);
  display:flex;align-items:stretch;
}
.tab-btn {
  flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
  background:none;border:none;color:var(--text3);
  font-family:'Crimson Pro',serif;font-size:13px;cursor:pointer;
  border-right:1px solid var(--border);transition:all .2s;
  position:relative;
}
.tab-btn:last-child{border-right:none;}
.tab-btn .t-ico{font-size:16px;}
.tab-btn:hover{background:rgba(255,255,255,.03);color:var(--text);}
.tab-btn.active{background:rgba(200,168,75,.08);color:var(--gold2);}
.tab-btn.active::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--gold);}
.tab-notif{
  position:absolute;top:6px;right:calc(50% - 20px);
  background:var(--red2);color:#fff;font-size:9px;font-weight:700;
  width:14px;height:14px;border-radius:50%;display:flex;align-items:center;justify-content:center;
}

/* Side panels */
.side-panel {
  position:fixed;right:0;top:52px;bottom:44px;width:360px;z-index:150;
  background:linear-gradient(160deg,#0d1117 0%,#0f1420 100%);
  border-left:1px solid var(--border);
  transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;overflow:hidden;
}
.side-panel.open{transform:translateX(0);}

.sp-header{
  padding:16px 18px 12px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
}
.sp-title{font-family:'Cinzel',serif;font-size:16px;color:var(--gold2);letter-spacing:1px;}
.sp-close{background:none;border:none;color:var(--text3);cursor:pointer;font-size:18px;padding:2px 6px;border-radius:4px;}
.sp-close:hover{color:var(--text);}
.sp-body{flex:1;overflow-y:auto;padding:14px 18px;}
.sp-body::-webkit-scrollbar{width:3px;}
.sp-body::-webkit-scrollbar-thumb{background:var(--border2);}

/* Sections inside panels */
.sec{margin-bottom:20px;}
.sec-title{
  font-family:'Cinzel',serif;font-size:11px;letter-spacing:1.5px;
  color:var(--text3);text-transform:uppercase;
  margin-bottom:10px;padding-bottom:6px;
  border-bottom:1px solid var(--border);
}

/* Stat rows */
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.03);}
.stat-row:last-child{border-bottom:none;}
.sr-label{font-size:13px;color:var(--text2);}
.sr-value{font-size:13px;font-weight:600;}
.sr-pos{color:#6fcf97;}
.sr-neg{color:#eb5757;}
.sr-neu{color:var(--gold);}

/* Progress bars */
.prog-bar{margin:8px 0;}
.prog-label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;}
.prog-label span:first-child{color:var(--text2);}
.prog-track{background:rgba(255,255,255,.05);border-radius:3px;height:5px;overflow:hidden;}
.prog-fill{height:100%;border-radius:3px;transition:width .6s ease;}
.prog-gold{background:linear-gradient(90deg,#8b6914,#c8a84b);}
.prog-green{background:linear-gradient(90deg,#145a32,#27ae60);}
.prog-red{background:linear-gradient(90deg,#7b241c,#c0392b);}
.prog-blue{background:linear-gradient(90deg,#154360,#2980b9);}
.prog-purple{background:linear-gradient(90deg,#4a235a,#8e44ad);}

/* Buttons */
.btn {
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:7px 14px;border-radius:5px;cursor:pointer;
  font-family:'Crimson Pro',serif;font-size:13px;font-weight:600;
  border:none;transition:all .2s;
}
.btn-gold{background:rgba(200,168,75,.15);border:1px solid rgba(200,168,75,.35);color:var(--gold2);}
.btn-gold:hover{background:rgba(200,168,75,.25);}
.btn-red{background:rgba(192,57,43,.15);border:1px solid rgba(192,57,43,.35);color:#eb5757;}
.btn-red:hover{background:rgba(192,57,43,.25);}
.btn-green{background:rgba(26,122,74,.15);border:1px solid rgba(26,122,74,.35);color:#6fcf97;}
.btn-green:hover{background:rgba(26,122,74,.25);}
.btn-blue{background:rgba(26,74,122,.15);border:1px solid rgba(26,74,122,.35);color:#60a5fa;}
.btn-blue:hover{background:rgba(26,74,122,.25);}
.btn-sm{padding:4px 10px;font-size:12px;}
.btn-block{width:100%;margin-bottom:6px;}
.btn:disabled{opacity:.4;cursor:not-allowed;}

/* Country info panel (click on map) */
#country-panel {
  position:fixed;left:12px;top:62px;width:280px;z-index:180;
  background:linear-gradient(160deg,#0d1117,#0f1420);
  border:1px solid var(--border);border-radius:10px;
  box-shadow:0 20px 50px rgba(0,0,0,.6);
  transform:translateX(-320px);transition:transform .3s cubic-bezier(.4,0,.2,1);
  overflow:hidden;
}
#country-panel.open{transform:translateX(0);}
.cp-header{
  padding:14px 16px 10px;
  background:linear-gradient(135deg,rgba(200,168,75,.06),transparent);
  border-bottom:1px solid var(--border);
}
.cp-flag{font-size:30px;margin-bottom:6px;}
.cp-name{font-family:'Cinzel',serif;font-size:16px;color:var(--gold2);}
.cp-relation{font-size:11px;margin-top:3px;}
.cp-body{padding:12px 16px;}
.cp-actions{padding:10px 16px 14px;display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid var(--border);}

/* Events feed */
#events-feed {
  position:fixed;left:12px;bottom:54px;width:300px;z-index:140;
  max-height:200px;overflow:hidden;pointer-events:none;
}
.event-item {
  background:rgba(13,17,23,.92);border:1px solid var(--border);
  border-radius:6px;padding:8px 12px;margin-bottom:6px;
  font-size:12px;animation:slideInLeft .3s ease;
  pointer-events:all;
}
@keyframes slideInLeft{from{transform:translateX(-30px);opacity:0;}to{transform:translateX(0);opacity:1;}}
.ev-war{border-left:3px solid var(--red2);}
.ev-diplo{border-left:3px solid var(--blue2);}
.ev-econ{border-left:3px solid var(--green2);}
.ev-pol{border-left:3px solid var(--purple2);}
.ev-nat{border-left:3px solid var(--orange2);}
.ev-title{font-family:'Cinzel',serif;font-size:11px;color:var(--gold);margin-bottom:2px;}
.ev-text{color:var(--text2);line-height:1.4;}

/* Map styles */
.country-path {
  stroke:#0a0d12;stroke-width:.3px;cursor:pointer;
  transition:filter .15s;
}
.country-path:hover{filter:brightness(1.4);}
.country-path.player{stroke:var(--gold);stroke-width:1.5px;}
.country-path.ally{stroke:#27ae60;stroke-width:1px;}
.country-path.enemy{stroke:#c0392b;stroke-width:1px;}
.country-path.at-war{animation:warPulse 1.5s ease-in-out infinite;}
@keyframes warPulse{0%,100%{stroke-opacity:1;}50%{stroke-opacity:.3;}}

.graticule{fill:none;stroke:rgba(200,168,75,.04);stroke-width:.4px;}
.sphere{fill:#060810;}

/* Army markers */
.army-marker{cursor:pointer;transition:transform .2s;}
.army-marker:hover{transform:scale(1.2);}

/* Tooltip */
#map-tip {
  position:fixed;z-index:999;
  background:rgba(8,9,13,.96);border:1px solid var(--border);
  border-radius:6px;padding:6px 12px;font-size:12px;
  pointer-events:none;display:none;color:var(--text);
  box-shadow:0 4px 16px rgba(0,0,0,.4);
}

/* War declaration modal */
.modal-overlay {
  position:fixed;inset:0;z-index:500;
  background:rgba(0,0,0,.7);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;
}
.modal {
  background:linear-gradient(160deg,#0d1117,#0f1420);
  border:1px solid var(--border);border-radius:12px;
  width:420px;padding:24px;
  box-shadow:0 30px 80px rgba(0,0,0,.8);
}
.modal-title{font-family:'Cinzel',serif;font-size:20px;color:var(--gold2);margin-bottom:6px;}
.modal-sub{font-size:13px;color:var(--text2);margin-bottom:20px;line-height:1.5;}
.modal-actions{display:flex;gap:10px;margin-top:20px;}

/* Notifications */
#notif-stack{position:fixed;top:60px;right:370px;z-index:300;width:280px;}
.notif{
  background:rgba(13,17,23,.96);border:1px solid var(--border);border-radius:8px;
  padding:10px 14px;margin-bottom:8px;
  font-size:12px;animation:notifIn .3s ease;
  border-left:3px solid var(--gold);
}
@keyframes notifIn{from{transform:translateX(30px);opacity:0;}to{transform:translateX(0);opacity:1;}}

/* Loading */
#loading-screen{
  position:fixed;inset:0;z-index:1000;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
}
.load-title{font-family:'Cinzel',serif;font-size:32px;color:var(--gold2);letter-spacing:4px;}
.load-bar-track{width:300px;height:3px;background:var(--border);border-radius:2px;}
.load-bar-fill{height:100%;background:var(--gold);border-radius:2px;transition:width .4s;}
.load-text{font-size:13px;color:var(--text3);}
</style>
</head>
<body>

<!-- LOADING -->
<div id="loading-screen">
  <div class="load-title">GEOPOLÍTICA</div>
  <div class="load-bar-track"><div class="load-bar-fill" id="load-bar" style="width:0%"></div></div>
  <div class="load-text" id="load-text">Inicializando motor do jogo…</div>
</div>

<!-- SELECT SCREEN -->
<div id="screen-select" style="display:none">
  <div id="select-bg"></div>
  <div class="select-title">GEOPOLÍTICA</div>
  <div class="select-sub">Escolha sua nação e escreva a história</div>
  <div id="country-list"></div>
</div>

<!-- GAME SCREEN -->
<div id="screen-game">
  <!-- MAP -->
  <svg id="map-svg">
    <g id="map-g"></g>
  </svg>

  <!-- TOP HUD -->
  <div id="hud-top">
    <div class="hud-player"><span class="flag" id="hud-flag">🌍</span><span id="hud-name">Nação</span></div>
    <div class="hud-sep"></div>
    <div class="hud-stat econ"><span class="ico">💰</span><div><div class="val" id="hud-gdp">0</div><div class="lbl">PIB/ano</div></div></div>
    <div class="hud-stat mil"><span class="ico">⚔️</span><div><div class="val" id="hud-mil">0</div><div class="lbl">Exército</div></div></div>
    <div class="hud-stat pop"><span class="ico">👥</span><div><div class="val" id="hud-pop">0</div><div class="lbl">Pop.</div></div></div>
    <div class="hud-stat stab"><span class="ico">🏛️</span><div><div class="val" id="hud-stab">0%</div><div class="lbl">Estab.</div></div></div>
    <div class="hud-stat app"><span class="ico">📊</span><div><div class="val" id="hud-app">0%</div><div class="lbl">Aprova.</div></div></div>
    <div class="hud-sep"></div>
    <div class="hud-date" id="hud-date">Jan 2025</div>
    <div class="hud-controls">
      <button class="ctrl-btn" id="btn-pause" title="Pausar">⏸</button>
      <button class="ctrl-btn" id="btn-slow" title="Devagar">▶</button>
      <button class="ctrl-btn active" id="btn-normal" title="Normal">▶▶</button>
      <button class="ctrl-btn" id="btn-fast" title="Rápido">▶▶▶</button>
    </div>
  </div>

  <!-- BOTTOM TABS -->
  <div id="hud-tabs">
    <button class="tab-btn active" data-tab="overview" onclick="openTab('overview')">
      <span class="t-ico">🌍</span> Visão Geral
    </button>
    <button class="tab-btn" data-tab="economy" onclick="openTab('economy')">
      <span class="t-ico">💰</span> Economia
    </button>
    <button class="tab-btn" data-tab="military" onclick="openTab('military')">
      <span class="t-ico">⚔️</span> Militar
    </button>
    <button class="tab-btn" data-tab="diplomacy" onclick="openTab('diplomacy')">
      <span class="t-ico">🤝</span> Diplomacia
      <span class="tab-notif" id="notif-diplo" style="display:none">!</span>
    </button>
    <button class="tab-btn" data-tab="politics" onclick="openTab('politics')">
      <span class="t-ico">🏛️</span> Política
    </button>
  </div>

  <!-- SIDE PANELS -->
  <!-- OVERVIEW -->
  <div class="side-panel" id="panel-overview">
    <div class="sp-header">
      <div class="sp-title">📊 Visão Geral</div>
      <button class="sp-close" onclick="closePanel()">✕</button>
    </div>
    <div class="sp-body" id="overview-body"></div>
  </div>

  <!-- ECONOMY -->
  <div class="side-panel" id="panel-economy">
    <div class="sp-header">
      <div class="sp-title">💰 Economia</div>
      <button class="sp-close" onclick="closePanel()">✕</button>
    </div>
    <div class="sp-body" id="economy-body"></div>
  </div>

  <!-- MILITARY -->
  <div class="side-panel" id="panel-military">
    <div class="sp-header">
      <div class="sp-title">⚔️ Forças Armadas</div>
      <button class="sp-close" onclick="closePanel()">✕</button>
    </div>
    <div class="sp-body" id="military-body"></div>
  </div>

  <!-- DIPLOMACY -->
  <div class="side-panel" id="panel-diplomacy">
    <div class="sp-header">
      <div class="sp-title">🤝 Diplomacia</div>
      <button class="sp-close" onclick="closePanel()">✕</button>
    </div>
    <div class="sp-body" id="diplomacy-body"></div>
  </div>

  <!-- POLITICS -->
  <div class="side-panel" id="panel-politics">
    <div class="sp-header">
      <div class="sp-title">🏛️ Política Interna</div>
      <button class="sp-close" onclick="closePanel()">✕</button>
    </div>
    <div class="sp-body" id="politics-body"></div>
  </div>

  <!-- COUNTRY PANEL (left, map click) -->
  <div id="country-panel">
    <div class="cp-header">
      <div class="cp-flag" id="cp-flag">🌍</div>
      <div class="cp-name" id="cp-name">País</div>
      <div class="cp-relation" id="cp-relation"></div>
    </div>
    <div class="cp-body" id="cp-body"></div>
    <div class="cp-actions" id="cp-actions"></div>
  </div>

  <!-- EVENTS FEED -->
  <div id="events-feed"></div>

  <!-- TOOLTIP -->
  <div id="map-tip"></div>

  <!-- NOTIFICATIONS -->
  <div id="notif-stack"></div>
</div>

<script>

// ═══════════════════════════════════════════════════════════
//  LOADING
// ═══════════════════════════════════════════════════════════
async function boot() {
  setLoad(10, "Carregando dados geográficos…");
  const world = await fetch("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json").then(r=>r.json());
  setLoad(40, "Processando fronteiras…");
  const countries = topojson.feature(world, world.objects.countries);
  countries.features.forEach(f => { f.properties.name = ID_NAMES[String(f.id)] || ""; });
  G.mapFeatures = countries.features;
  setLoad(70, "Inicializando sistemas…");
  initGameData();
  setLoad(90, "Preparando mapa…");
  await new Promise(r=>setTimeout(r,300));
  setLoad(100, "Pronto!");
  await new Promise(r=>setTimeout(r,400));
  document.getElementById("loading-screen").style.display="none";
  showSelectScreen();
}

function setLoad(pct, msg) {
  document.getElementById("load-bar").style.width = pct+"%";
  document.getElementById("load-text").textContent = msg;
}

function initGameData() {
  // Deep copy + init AI countries
  Object.keys(COUNTRIES_DATA).forEach(id => {
    G.countries[id] = {
      ...JSON.parse(JSON.stringify(COUNTRIES_DATA[id])),
      id,
      gdpGrowth: (Math.random()*4-1).toFixed(1)*1,
      inflation: (Math.random()*8+1).toFixed(1)*1,
      unemployment: (Math.random()*12+3).toFixed(1)*1,
      budget: 0,
      debt: Math.floor(Math.random()*80+20),
      morale: Math.floor(Math.random()*30+60),
      tech: Math.floor(Math.random()*40+30),
      at_war_with: [],
      relation: {}, // relation[otherId] = -100..100
    };
  });
  // Init some relations
  G.countries["76"].relation = {"840":30,"156":-10,"643":-5,"32":60,"170":50};
  G.countries["840"].relation = {"76":30,"826":80,"276":75,"156":-40,"643":-60,"364":-70,"408":-80};
  G.countries["156"].relation = {"364":50,"643":30,"840":-40,"276":-20};
  G.countries["643"].relation = {"156":30,"804":-80,"840":-60,"276":-40};
}

}

let mapSvg, mapG, mapZoom, mapPath, mapProjection;
const mapW = ()=>window.innerWidth, mapH = ()=>window.innerHeight;

function initMap() {
  mapSvg = d3.select("#map-svg");
  mapG = d3.select("#map-g");
  const w=mapW(), h=mapH();
  mapProjection = d3.geoNaturalEarth1().scale(w/6.3).translate([w/2,h/2]);
  mapPath = d3.geoPath().projection(mapProjection);

  // Sphere + grid
  mapG.append("path").datum({type:"Sphere"}).attr("class","sphere").attr("d",mapPath);
  mapG.append("path").datum(d3.geoGraticule()()).attr("class","graticule").attr("d",mapPath);

  // Countries
  mapG.selectAll(".country-path")
    .data(G.mapFeatures).enter().append("path")
    .attr("class","country-path")
    .attr("id", d=>"cp-"+d.id)
    .attr("d", mapPath)
    .attr("fill", d=>getCountryColor(String(d.id)))
    .on("mouseover",(ev,d)=>{
      const n = ID_NAMES[String(d.id)]||"";
      const cd = G.countries[String(d.id)];
      const nm = cd ? cd.name : n;
      if(!nm) return;
      const tip = document.getElementById("map-tip");
      tip.style.display="block";
      tip.innerHTML = `<b>${cd?cd.flag:""} ${nm}</b>${cd?` <span style="color:var(--text3)">— ${cd.region}</span>`:""}`;
    })
    .on("mousemove", ev=>{
      const tip=document.getElementById("map-tip");
      tip.style.left=(ev.clientX+12)+"px";
      tip.style.top=(ev.clientY-32)+"px";
    })
    .on("mouseleave",()=>{ document.getElementById("map-tip").style.display="none"; })
    .on("click",(ev,d)=>{ ev.stopPropagation(); selectCountry(String(d.id)); });

  // Zoom
  mapZoom = d3.zoom().scaleExtent([1,12]).on("zoom",ev=>{
    mapG.attr("transform",ev.transform);
    mapG.selectAll(".country-path").attr("stroke-width",.3/ev.transform.k);
  });
  mapSvg.call(mapZoom);
  mapSvg.on("click",()=>closeCountryPanel());

  // Highlight player country
  highlightPlayerCountry();
}

function getCountryColor(id) {
  const c = G.countries[id];
  if(!c) return "#141c28";
  if(id === G.player) return "#1a4a2a";
  // At war with player?
  const p = G.countries[G.player];
  if(p && p.at_war_with && p.at_war_with.includes(id)) return "#3a1010";
  // Allied?
  if(isAllied(G.player, id)) return "#142a3a";
  return c.color || "#141c28";
}

function highlightPlayerCountry() {
  mapG.selectAll(".country-path")
    .attr("fill",d=>getCountryColor(String(d.id)))
    .classed("player",d=>String(d.id)===G.player)
    .classed("ally",d=>isAllied(G.player,String(d.id)))
    .classed("enemy",d=>{ const p=G.countries[G.player]; return p&&p.at_war_with&&p.at_war_with.includes(String(d.id));})
    .classed("at-war",d=>{ const c=G.countries[String(d.id)]; return c&&c.at_war_with&&c.at_war_with.length>0;});
}

function selectCountry(id) {
  const c = G.countries[id];
  const name = c ? c.name : (ID_NAMES[id]||"País desconhecido");
  G.selectedCountry = id;
  document.getElementById("cp-flag").textContent = c ? c.flag : "🌍";
  document.getElementById("cp-name").textContent = name;

  const rel = getRelation(G.player, id);
  const relEl = document.getElementById("cp-relation");
  if(id === G.player) relEl.innerHTML = `<span style="color:var(--gold)">✦ Seu país</span>`;
  else if(G.countries[G.player].at_war_with.includes(id)) relEl.innerHTML=`<span style="color:var(--red2)">⚔️ Em guerra</span>`;
  else if(isAllied(G.player,id)) relEl.innerHTML=`<span style="color:var(--green2)">🤝 Aliado</span>`;
  else relEl.innerHTML=`<span style="color:${rel>0?"#6fcf97":rel<0?"#eb5757":"var(--text3)"}">Relação: ${rel>0?"+":""}${rel}</span>`;

  const body = document.getElementById("cp-body");
  if(c) {
    body.innerHTML=`
      <div class="stat-row"><span class="sr-label">PIB</span><span class="sr-value sr-neu">$${c.gdp}B</span></div>
      <div class="stat-row"><span class="sr-label">Crescimento</span><span class="sr-value ${c.gdpGrowth>=0?"sr-pos":"sr-neg"}">${c.gdpGrowth>=0?"+":""}${c.gdpGrowth}%</span></div>
      <div class="stat-row"><span class="sr-label">População</span><span class="sr-value sr-neu">${c.pop}M</span></div>
      <div class="stat-row"><span class="sr-label">Exército</span><span class="sr-value sr-neu">${(c.mil/1000).toFixed(0)}K</span></div>
      <div class="stat-row"><span class="sr-label">Estabilidade</span><span class="sr-value ${c.stability>60?"sr-pos":c.stability>40?"sr-neu":"sr-neg"}">${c.stability}%</span></div>
      <div class="stat-row"><span class="sr-label">Ideologia</span><span class="sr-value sr-neu">${ideologyLabel(c.ideology)}</span></div>
    `;
  } else {
    body.innerHTML=`<div style="color:var(--text3);font-size:13px">País sem dados no jogo</div>`;
  }

  // Action buttons
  const actions = document.getElementById("cp-actions");
  if(id === G.player || !c) { actions.innerHTML=""; }
  else {
    const p = G.countries[G.player];
    const atWar = p.at_war_with.includes(id);
    const allied = isAllied(G.player,id);
    let btns = `<button class="btn btn-blue btn-sm" onclick="openDiplomacyWith('${id}')">📜 Diplomacia</button>`;
    if(!atWar && !allied) btns += `<button class="btn btn-gold btn-sm" onclick="proposeAlliance('${id}')">🤝 Propor Aliança</button>`;
    if(!atWar) btns += `<button class="btn btn-red btn-sm" onclick="declareWarOn('${id}')">⚔️ Declarar Guerra</button>`;
    else btns += `<button class="btn btn-green btn-sm" onclick="proposePeace('${id}')">☮️ Propor Paz</button>`;
    actions.innerHTML = btns;
  }

  document.getElementById("country-panel").classList.add("open");
}

function closeCountryPanel() {
  document.getElementById("country-panel").classList.remove("open");
  G.selectedCountry = null;
}

// ═══════════════════════════════════════════════════════════
//  TABS & PANELS
// ═══════════════════════════════════════════════════════════
function openTab(tab) {
  G.activePanel = tab;
  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));
  document.querySelectorAll(".side-panel").forEach(p=>p.classList.remove("open"));
  const el = document.getElementById("panel-"+tab);
  if(el) {
    el.classList.add("open");
    renderPanel(tab);
  }
}

function closePanel() {
  document.querySelectorAll(".side-panel").forEach(p=>p.classList.remove("open"));
  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
}

function renderPanel(tab) {
  const p = G.countries[G.player];
  if(tab==="overview") renderOverview(p);
  else if(tab==="economy") renderEconomy(p);
  else if(tab==="military") renderMilitary(p);
  else if(tab==="diplomacy") renderDiplomacy(p);
  else if(tab==="politics") renderPolitics(p);
}

  const income = Math.floor(p.gdp * p.tax/100 + p.trade * 0.1);

  const balance = income - spending;
  document.getElementById("economy-body").innerHTML=`
    <div class="sec">
      <div class="sec-title">Indicadores</div>
      <div class="stat-row"><span class="sr-label">PIB Total</span><span class="sr-value sr-neu">$${p.gdp}B</span></div>

// ═══════════════════════════════════════════════════════════
//  ACTIONS
// ═══════════════════════════════════════════════════════════
function changeTax(delta) {
  const p = G.countries[G.player];
  p.tax = Math.max(5, Math.min(60, p.tax+delta));
  if(delta>0) { p.approval = Math.max(0,p.approval-3); addEvent(`📋 Impostos aumentados para ${p.tax}%. Aprovação -3%.`,"pol"); }
  else { p.gdpGrowth = Math.min(10, p.gdpGrowth+0.3); addEvent(`📋 Impostos reduzidos para ${p.tax}%. Crescimento +0.3%.`,"econ"); }
  renderPanel("economy"); updateHUD();
}

function invest(type) {
  const p = G.countries[G.player];
  const costs = {infrastructure:50,tech:30,education:20,healthcare:25,military:40};
  const cost = costs[type]||30;
  if(p.gdp < cost*10) { notify("⚠️ PIB insuficiente para este investimento."); return; }
  p.gdp = Math.max(0, p.gdp-cost);
  if(type==="infrastructure") { p.gdpGrowth+=0.5; p.approval+=2; addEvent(`🏗️ Infraestrutura expandida. Crescimento +0.5%, Aprovação +2%.`,"econ"); }
  if(type==="tech") { p.tech=Math.min(100,p.tech+5); addEvent(`🔬 P&D avançado. Tecnologia +5%.`,"econ"); }
  if(type==="education") { p.approval+=3; p.stability+=2; addEvent(`📚 Educação expandida. Aprovação +3%, Estab. +2%.`,"pol"); }
  if(type==="healthcare") { p.pop+=1; p.approval+=4; addEvent(`🏥 Saúde pública melhorada. Pop +1M, Aprovação +4%.`,"pol"); }
  if(type==="military") { p.morale=Math.min(100,p.morale+8); p.tech=Math.min(100,p.tech+3); addEvent(`🔧 Forças Armadas modernizadas. Moral +8%, Tech +3%.`,"war"); }
  renderPanel(G.activePanel); updateHUD();
}

function recruit(amount) {
  const p = G.countries[G.player];
  const cost = amount/5000;
  p.mil += amount;
  p.gdp = Math.max(0, p.gdp-cost);
  addEvent(`🪖 ${(amount/1000).toFixed(0)}K soldados recrutados.`,"war");
  renderPanel("military"); updateHUD();
}

function policy(type) {
  const p = G.countries[G.player];
  if(type==="welfare"){ p.approval=Math.min(100,p.approval+6); p.gdp=Math.max(0,p.gdp-15); addEvent("🤝 Bem-estar expandido. Aprovação +6%","pol"); }
  if(type==="austerity"){ p.approval=Math.max(0,p.approval-8); p.stability=Math.min(100,p.stability+3); addEvent("✂️ Austeridade implementada. Aprovação -8%","pol"); }
  if(type==="stimulus"){ p.gdpGrowth+=0.8; p.inflation+=1.5; addEvent("📈 Estímulo econômico. Crescimento +0.8%, Inflação +1.5%","econ"); }
  if(type==="propaganda"){ p.approval=Math.min(100,p.approval+5); p.stability=Math.min(100,p.stability+2); addEvent("📢 Propaganda estatal. Aprovação +5%","pol"); }
  if(type==="reform"){ p.stability=Math.min(100,p.stability+8); p.approval=Math.max(0,p.approval-3); addEvent("⚖️ Reforma política. Estabilidade +8%","pol"); }
  renderPanel("politics"); updateHUD();
}

function declareWarOn(targetId) {
  const p = G.countries[G.player];
  const t = G.countries[targetId];
  if(!t) return;
  if(p.at_war_with.includes(targetId)) { notify("Você já está em guerra com "+t.name); return; }
  showModal(
    `⚔️ Declarar Guerra a ${t.flag} ${t.name}`,
    `Esta ação iniciará um conflito armado. Lembre-se que guerras consomem recursos, reduzem aprovação e podem ter aliados envolvidos. Suas relações com ${t.name} são de ${p.relation[targetId]||0} pontos.`,
    [
      {label:"⚔️ Declarar Guerra!", cls:"btn-red", action:()=>{ addWar(G.player,targetId); closeCountryPanel(); openTab("military"); }},
      {label:"Cancelar", cls:"btn-gold", action:()=>{}}
    ]
  );
}

function addWar(aId, bId) {
  const a = G.countries[aId], b = G.countries[bId];
  if(!a||!b) return;
  G.wars.push({a:aId,b:bId,start:G.tick,progress:0,winner:null});
  a.at_war_with.push(bId);
  b.at_war_with.push(aId);
  a.relation[bId]=(a.relation[bId]||0)-50;
  b.relation[aId]=(b.relation[aId]||0)-50;
  a.approval=Math.max(0,a.approval-5);
  addEvent(`⚔️ GUERRA! ${a.name} declarou guerra a ${b.name}!`,"war");
  highlightPlayerCountry();
  notify(`⚔️ Guerra iniciada contra ${b.name}`);
}

function proposePeace(targetId) {
  const t = G.countries[targetId];
  if(!t) return;
  const warIdx = G.wars.findIndex(w=>(w.a===G.player&&w.b===targetId)||(w.b===G.player&&w.a===targetId));
  if(warIdx===-1) { notify("Você não está em guerra com "+t.name); return; }
  showModal(
    `☮️ Propor Paz com ${t.flag} ${t.name}`,
    `Encerrar o conflito agora. Dependendo do progresso da guerra, você pode precisar ceder territórios ou pagar reparações.`,
    [
      {label:"☮️ Aceitar Paz", cls:"btn-green", action:()=>endWar(G.player,targetId,"peace")},
      {label:"Continuar Lutando", cls:"btn-red", action:()=>{}}
    ]
  );
}

function endWar(aId,bId,reason) {
  const a=G.countries[aId], b=G.countries[bId];
  const idx=G.wars.findIndex(w=>(w.a===aId&&w.b===bId)||(w.b===aId&&w.a===bId));
  if(idx!==-1) G.wars.splice(idx,1);
  a.at_war_with=a.at_war_with.filter(x=>x!==bId);
  b.at_war_with=b.at_war_with.filter(x=>x!==aId);
  a.relation[bId]=(a.relation[bId]||0)+20;
  b.relation[aId]=(b.relation[aId]||0)+20;
  addEvent(`☮️ Paz firmada entre ${a.name} e ${b.name}`, "diplo");
  notify(`☮️ Paz com ${b.name} estabelecida!`);
  highlightPlayerCountry();
  renderPanel(G.activePanel); updateHUD();
}

function escalateWar(targetId) {
  const p=G.countries[G.player];
  const war=G.wars.find(w=>(w.a===G.player&&w.b===targetId)||(w.b===G.player&&w.a===targetId));
  if(!war) return;
  p.morale=Math.max(0,p.morale-5);
  const boost = calcWarScore(G.player,targetId)*0.5;
  war.progress=Math.min(100,war.progress+boost);
  addEvent(`🔥 Ofensiva lançada! Progresso da guerra aumentou.`,"war");
  renderPanel("military"); updateHUD();
}

function proposeAlliance(targetId) {
  const t=G.countries[targetId];
  if(!t) return;
  const rel=G.countries[G.player].relation[targetId]||0;
  if(rel<-20) { notify("⚠️ Relações muito negativas para propor aliança."); return; }
  const chance = rel>30?"alta":rel>0?"média":"baixa";
  showModal(
    `🤝 Propor Aliança com ${t.flag} ${t.name}`,
    `Sua relação atual é ${rel>0?"+":""}${rel}. Chance de aceitação: ${chance}. Alianças oferecem proteção mútua mas podem arrastar você para conflitos.`,
    [
      {label:"🤝 Propor Aliança", cls:"btn-gold", action:()=>{
        if(rel>0||Math.random()>0.4) { addAlliance(G.player,targetId); }
        else { addEvent(`🚫 ${t.name} recusou sua proposta de aliança.`,"diplo"); notify("Proposta recusada."); }
      }},
      {label:"Cancelar", cls:"btn-blue", action:()=>{}}
    ]
  );
}

function addAlliance(aId,bId) {
  if(isAllied(aId,bId)) return;
  const a=G.countries[aId],b=G.countries[bId];
  if(!a||!b) return;
  G.alliances.push({a:aId,b:bId,since:G.tick});
  a.relation[bId]=(a.relation[bId]||0)+30;
  b.relation[aId]=(b.relation[aId]||0)+30;
  if(aId===G.player||bId===G.player) {
    addEvent(`🤝 Aliança formada: ${a.name} e ${b.name}`, "diplo");
    notify(`🤝 Aliança com ${(aId===G.player?b:a).name} estabelecida!`);
  }
  highlightPlayerCountry();
  renderPanel(G.activePanel);
}

function breakAlliance(otherId) {
  const other=G.countries[otherId];
  G.alliances=G.alliances.filter(a=>!((a.a===G.player&&a.b===otherId)||(a.b===G.player&&a.a===otherId)));
  if(other){ G.countries[G.player].relation[otherId]=(G.countries[G.player].relation[otherId]||0)-20; }
  addEvent(`💔 Aliança com ${other?other.name:"?"} desfeita.`,"diplo");
  highlightPlayerCountry();
  renderPanel("diplomacy");
}

function isAllied(a,b) {
  return G.alliances.some(al=>(al.a===a&&al.b===b)||(al.b===a&&al.a===b));
}

function getRelation(a,b) {
  return (G.countries[a]?.relation[b])||0;
}

function openDiplomacyWith(id) {
  openTab("diplomacy");
  setTimeout(()=>selectCountry(id),300);
}

function sendAid() {
  const p=G.countries[G.player];
  p.gdp=Math.max(0,p.gdp-5);
  // improve relations with all poor countries
  Object.entries(G.countries).forEach(([id,c])=>{
    if(c.gdp<500) { p.relation[id]=(p.relation[id]||0)+5; }
  });
  addEvent("💸 Ajuda humanitária enviada. Relações com países pobres melhoradas.","diplo");
  notify("💸 Ajuda humanitária enviada!");
  renderPanel("diplomacy");
}

function hostSummit() {
  const p=G.countries[G.player];
  p.approval=Math.min(100,p.approval+3);
  p.stability=Math.min(100,p.stability+2);
  Object.keys(G.countries).forEach(id=>{ if(id!==G.player) p.relation[id]=(p.relation[id]||0)+3; });
  addEvent("🌐 Cúpula Mundial organizada por "+p.name+". Prestígio aumentado.","diplo");
  notify("🌐 Cúpula realizada! Aprovação +3%");
  renderPanel("diplomacy");
}

// ═══════════════════════════════════════════════════════════
//  WAR CALC
// ═══════════════════════════════════════════════════════════
function calcPower(id) {
  const c=G.countries[id]; if(!c) return 0;
  return Math.round(c.mil/10000 + c.tech*0.5 + c.morale*0.3 + c.stability*0.2);
}

function calcWarScore(attacker,defender) {
  return calcPower(attacker)-calcPower(defender);
}

// ═══════════════════════════════════════════════════════════
//  GAME LOOP
// ═══════════════════════════════════════════════════════════
let gameInterval = null;
const SPEEDS = [0, 2000, 800, 300];

function startGameLoop() {
  setSpeed(2);
}

function setSpeed(s) {
  G.speed=s;
  if(gameInterval) clearInterval(gameInterval);
  if(s>0) gameInterval=setInterval(gameTick, SPEEDS[s]);
  document.getElementById("btn-pause").classList.toggle("active",s===0);
  document.getElementById("btn-slow").classList.toggle("active",s===1);
  document.getElementById("btn-normal").classList.toggle("active",s===2);
  document.getElementById("btn-fast").classList.toggle("active",s===3);
}

document.getElementById("btn-pause").onclick=()=>setSpeed(0);
document.getElementById("btn-slow").onclick=()=>setSpeed(1);
document.getElementById("btn-normal").onclick=()=>setSpeed(2);
document.getElementById("btn-fast").onclick=()=>setSpeed(3);

function gameTick() {
  G.tick++;
  advanceDate();
  tickEconomy();
  tickMilitary();
  tickPolitics();
  tickAI();
  updateHUD();
  if(G.activePanel) renderPanel(G.activePanel);
}

function advanceDate() {
  G.date.month++;
  if(G.date.month>=12){ G.date.month=0; G.date.year++; yearlyEvents(); }
  document.getElementById("hud-date").textContent = MONTH_NAMES[G.date.month]+" "+G.date.year;
}

function tickEconomy() {
  Object.values(G.countries).forEach(c=>{
    // GDP growth
    const growth = c.gdpGrowth/100/12;
    c.gdp = +(c.gdp*(1+growth)).toFixed(1);
    // Tax revenue
    const income=(c.gdp*c.tax/100+c.trade*0.1)/12;
    const spending=(c.mil*0.001+c.pop*0.5)/12;
    c.budget=(income-spending);
    // Inflation
    if(c.inflation>5) c.gdpGrowth=Math.max(-5,c.gdpGrowth-0.02);
    c.inflation=Math.max(0,Math.min(30,c.inflation+(Math.random()-0.48)*0.1));
    // Unemployment
    c.unemployment=Math.max(1,Math.min(30,c.unemployment+(c.gdpGrowth<0?0.1:-0.05)+(Math.random()-0.5)*0.1));
    // War penalty
    if(c.at_war_with.length>0){ c.gdpGrowth=Math.max(-10,c.gdpGrowth-0.05); c.inflation+=0.05; }
  });
}

function tickMilitary() {
  G.wars.forEach(war=>{
    const a=G.countries[war.a], b=G.countries[war.b];
    if(!a||!b||war.winner) return;
    const scoreA=calcPower(war.a), scoreB=calcPower(war.b);
    const diff=(scoreA-scoreB)*0.3;
    war.progress=Math.min(100,Math.max(0,war.progress+diff*0.1+(Math.random()-0.5)*2));
    // Attrition
    a.mil=Math.max(1000,a.mil-Math.floor(Math.random()*500));
    b.mil=Math.max(1000,b.mil-Math.floor(Math.random()*500));
    a.morale=Math.max(10,a.morale-0.1);
    b.morale=Math.max(10,b.morale-0.1);
    a.approval=Math.max(0,a.approval-0.05);
    b.approval=Math.max(0,b.approval-0.05);
    // Victory condition
    if(war.progress>=100) {
      war.winner=war.a;
      endWar(war.a,war.b,"victory");
      addEvent(`🏆 ${a.name} venceu a guerra contra ${b.name}!`,"war");
    } else if(war.progress<=0) {
      war.winner=war.b;
      endWar(war.a,war.b,"defeat");
      addEvent(`🏆 ${b.name} venceu a guerra contra ${a.name}!`,"war");
    }
  });
}

function tickPolitics() {
  const p=G.countries[G.player];
  // Natural drift
  if(p.gdpGrowth>2) p.approval=Math.min(100,p.approval+0.05);
  else if(p.gdpGrowth<0) p.approval=Math.max(0,p.approval-0.1);
  if(p.inflation>8) p.approval=Math.max(0,p.approval-0.05);
  if(p.unemployment>12) p.approval=Math.max(0,p.approval-0.05);
  if(p.at_war_with.length>0) p.approval=Math.max(0,p.approval-0.05*p.at_war_with.length);
  // Stability
  if(p.approval<20) p.stability=Math.max(0,p.stability-0.2);
  else if(p.approval>60) p.stability=Math.min(100,p.stability+0.05);
}

function tickAI() {
  // Random AI events every ~20 ticks
  if(G.tick%20===0) randomAIEvent();
  // AI economic fluctuation
  Object.entries(G.countries).forEach(([id,c])=>{
    if(id===G.player) return;
    c.gdpGrowth=Math.max(-8,Math.min(12,c.gdpGrowth+(Math.random()-0.5)*0.2));
    c.approval=Math.max(5,Math.min(95,c.approval+(Math.random()-0.5)*0.3));
    c.stability=Math.max(5,Math.min(98,c.stability+(Math.random()-0.5)*0.1));
  });
}

function randomAIEvent() {
  const roll=Math.random();
  const ids=Object.keys(G.countries).filter(id=>id!==G.player);
  const rndId=()=>ids[Math.floor(Math.random()*ids.length)];

  if(roll<0.1) {
    // AI war
    const a=rndId(), b=rndId();
    if(a!==b && !G.countries[a].at_war_with.includes(b) && !isAllied(a,b)) {
      addWar(a,b);
    }
  } else if(roll<0.15) {
    // AI alliance
    const a=rndId(), b=rndId();
    if(a!==b && !isAllied(a,b)) addAlliance(a,b);
  } else if(roll<0.18) {
    // Natural disaster
    const id=rndId();
    const c=G.countries[id];
    if(c){ c.gdpGrowth=Math.max(-8,c.gdpGrowth-2); c.stability=Math.max(5,c.stability-8); addEvent(`🌪️ Desastre natural atingiu ${c.name}!`,"nat"); }
  } else if(roll<0.21) {
    // Election
    const id=rndId();
    const c=G.countries[id];
    if(c&&c.ideology==="democracy"){ addEvent(`🗳️ Eleições em ${c.name}. Novo governo assumirá em breve.`,"pol"); c.approval=Math.max(20,Math.min(80,c.approval+(Math.random()-0.5)*20)); }
  }
}

function yearlyEvents() {
  const p=G.countries[G.player];
  // Debt growth
  if(p.budget<0) p.debt=Math.min(300,p.debt+2);
  else p.debt=Math.max(0,p.debt-1);
  // Population growth
  p.pop=+(p.pop*1.008).toFixed(1);
  // Check election if democracy
  if(p.ideology==="democracy" && G.date.year%4===0 && G.date.month===0) {
    triggerPlayerElection();
  }
  addEvent(`📅 Ano ${G.date.year}: PIB de ${p.name} é $${p.gdp.toFixed(0)}B (${p.gdpGrowth>=0?"+":""}${p.gdpGrowth}%)`,"econ");
}

function triggerPlayerElection() {
  const p=G.countries[G.player];
  addEvent(`🗳️ ELEIÇÃO! O povo de ${p.name} vai às urnas!`,"pol");
  notify("🗳️ Eleições nacionais! Sua aprovação é "+p.approval+"%");
  document.getElementById("notif-diplo").style.display="flex";
  showModal(
    `🗳️ Eleições Nacionais em ${p.name}`,
    `Sua aprovação atual é ${p.approval}%. ${p.approval>50?"Você é favorito para reeleição!":p.approval>30?"Está apertado. Sua reeleição não é garantida.":"Você está em risco. A oposição pode vencer."}`,
    [
      {label:"🗳️ Campanha: Economia", cls:"btn-green", action:()=>runCampaign("economy")},
      {label:"🗳️ Campanha: Segurança", cls:"btn-red", action:()=>runCampaign("security")},
      {label:"🗳️ Campanha: Social", cls:"btn-purple", action:()=>runCampaign("social")},
    ]
  );
}

function runCampaign(type) {
  const p=G.countries[G.player];
  let bonus=0;
  if(type==="economy"){ bonus=p.gdpGrowth>1?10:-5; }
  if(type==="security"){ bonus=p.at_war_with.length===0?8:-8; }
  if(type==="social"){ bonus=5; }
  const result = p.approval+bonus+Math.floor(Math.random()*20-10);
  if(result>45) {
    p.approval=Math.min(100,p.approval+5);
    addEvent(`🏆 ${p.name} reeleito com ${result}% dos votos! Mandato renovado.`,"pol");
    notify("🏆 Você foi reeleito!");
  } else {
    p.approval=Math.max(10,p.approval-10);
    addEvent(`📊 Oposição forte: resultado apertado. Seu mandato foi renovado por pequena margem.`,"pol");
    notify("⚠️ Vitória por margem apertada!");
  }
  document.getElementById("notif-diplo").style.display="none";
}

// ═══════════════════════════════════════════════════════════
//  HUD
// ═══════════════════════════════════════════════════════════
function updateHUD() {
  const p=G.countries[G.player]; if(!p) return;
  document.getElementById("hud-flag").textContent=p.flag;
  document.getElementById("hud-name").textContent=p.name;
  document.getElementById("hud-gdp").textContent="$"+p.gdp.toFixed(0)+"B";
  document.getElementById("hud-mil").textContent=(p.mil/1000).toFixed(0)+"K";
  document.getElementById("hud-pop").textContent=p.pop.toFixed(0)+"M";
  document.getElementById("hud-stab").textContent=Math.round(p.stability)+"%";
  document.getElementById("hud-app").textContent=Math.round(p.approval)+"%";
}

// ═══════════════════════════════════════════════════════════
//  EVENTS FEED
// ═══════════════════════════════════════════════════════════
function addEvent(text, type="diplo") {
  const feed=document.getElementById("events-feed");
  const typeMap={war:"ev-war",diplo:"ev-diplo",econ:"ev-econ",pol:"ev-pol",nat:"ev-nat"};
  const cls=typeMap[type]||"ev-diplo";
  const item=document.createElement("div");
  item.className=`event-item ${cls}`;
  item.innerHTML=`<div class="ev-text">${text}</div>`;
  feed.insertBefore(item,feed.firstChild);
  G.events.unshift({text,type,tick:G.tick});
  // Keep only last 5
  while(feed.children.length>5) feed.removeChild(feed.lastChild);
  setTimeout(()=>{ if(item.parentNode) item.style.opacity="0.4"; },8000);
}

// ═══════════════════════════════════════════════════════════
//  NOTIFICATIONS
// ═══════════════════════════════════════════════════════════
function notify(msg) {
  const stack=document.getElementById("notif-stack");
  const el=document.createElement("div");
  el.className="notif";
  el.textContent=msg;
  stack.appendChild(el);
  setTimeout(()=>{ el.style.opacity="0"; el.style.transition="opacity .5s"; setTimeout(()=>el.remove(),500); },4000);
}

// ═══════════════════════════════════════════════════════════
//  MODAL
// ═══════════════════════════════════════════════════════════
function showModal(title, desc, actions) {
  const overlay=document.createElement("div");
  overlay.className="modal-overlay";
  overlay.innerHTML=`
    <div class="modal">
      <div class="modal-title">${title}</div>
      <div class="modal-sub">${desc}</div>
      <div class="modal-actions">
        ${actions.map((a,i)=>`<button class="btn ${a.cls}" id="modal-btn-${i}">${a.label}</button>`).join("")}
      </div>
    </div>`;
  document.body.appendChild(overlay);
  actions.forEach((a,i)=>{
    document.getElementById("modal-btn-"+i).onclick=()=>{ overlay.remove(); a.action(); };
  });
  overlay.onclick=e=>{ if(e.target===overlay) overlay.remove(); };
}

// ═══════════════════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════════════════
function ideologyLabel(id) {
  const map={democracy:"🗳️ Democracia",autocracy:"👁️ Autocracia",monarchy:"👑 Monarquia",theocracy:"☪️ Teocracia"};
  return map[id]||id;
}

// Boot!
window.addEventListener("load", boot);
</script>
